server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API → backend service (same docker network). Runtime DNS resolution so the
    # web container survives the api container restarting.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8090;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # hashed build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: send everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
