server {
    listen 80;
    server_name sklad.dimkaprojects.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sklad.dimkaprojects.xyz;

    ssl_certificate /etc/letsencrypt/live/sklad.dimkaprojects.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sklad.dimkaprojects.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
