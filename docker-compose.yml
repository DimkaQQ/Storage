services:
  api:
    build: ./server
    image: pricecheck-api:latest
    container_name: pricecheck-api
    restart: unless-stopped
    environment:
      - TZ=Asia/Almaty
      - PORT=8090
      # доступ к iiko «заморожен» в файле .env рядом с этим файлом (см. .env.example); пусто — настраивается в программе
      - IIKO_PROVIDER=${IIKO_PROVIDER:-}
      - IIKO_SERVER_URL=${IIKO_SERVER_URL:-}
      - IIKO_LOGIN=${IIKO_LOGIN:-}
      - IIKO_PASSWORD=${IIKO_PASSWORD:-}
      - IIKO_API_LOGIN=${IIKO_API_LOGIN:-}
      - IIKO_ORGANIZATION_ID=${IIKO_ORGANIZATION_ID:-}
      - IIKO_LOCK_ORG=${IIKO_LOCK_ORG:-}
      # режим разработчика: DEVELOPER_KEY — ключ для «секретной кнопки»; не задан — на сервере закрыт для всех
      - DEVELOPER_KEY=${DEVELOPER_KEY:-}
    volumes:
      # данные, настройки iiko и плановые цены переживают пересборку
      - pricecheck-data:/app/data
    expose:
      - "8090"

  web:
    build: .
    image: pricecheck:latest
    container_name: pricecheck
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Тот же порт 3000, на который проксирует nginx (sklad.dimkaprojects.xyz).
      - "127.0.0.1:3000:80"

volumes:
  pricecheck-data:
