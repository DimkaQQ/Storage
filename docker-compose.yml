services:
  web:
    build: .
    image: pricecheck:latest
    container_name: pricecheck
    restart: unless-stopped
    ports:
      # Тот же порт 3000, на который уже проксирует nginx (sklad.dimkaprojects.xyz).
      # Слушаем только localhost — наружу порт не открыт, доступ идёт через nginx+HTTPS.
      - "127.0.0.1:3000:80"
